# Shared by every computer. Edit assignments here, commit, and push from main.
version: 1
coordinator: main
git:
  enabled: true
  remote: origin
  branch: main
  poll_seconds: 120
  auto_restart: true
reporting:
  enabled: true
  heartbeat_seconds: 30
storage:
  enabled: true
  hub: msi
  url: http://100.116.229.51:8767
  consumers: [main]
  publish: season
dashboard:
  enabled: true
  port: 8765
  open_browser: true
workers:
  main:
    role: monitor
    dashboard: true
    label: Main
    color: '#169f91'
    enabled: true
    assignments: []
  msi:
    role: worker
    dashboard: false
    label: MSI
    color: '#587bec'
    enabled: true
    assignments:
      - id: current-season
        competitions: [Premier League, Bundesliga, La Liga, Champions League, Europa League, Serie A, Ligue 1]
        seasons: ['2021/22']
        collection_types: [combined]
        spatial_capture: fast
  headless:
    role: worker
    dashboard: false
    label: Headless
    color: '#000000'
    enabled: true
    assignments:
      - id: current-season
        competitions: [ Premier League, Bundesliga, La Liga, Champions League, Europa League, Serie A, Ligue 1 ]
        seasons: [ '2022/23' ]
        collection_types: [ combined ]
        spatial_capture: fast
