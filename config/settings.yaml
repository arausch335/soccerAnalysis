# Shared settings for main.py, whoscored_events.py, and dataset_builder.py.
# Edit this file, then press Run in PyCharm; no CLI arguments are needed.
# Relative paths are always resolved from the project root.
paths:
  data: data
  dataset: dataset

collection:
  action: auto                 # auto, start, resume, export, status, probe
  competitions:
    - Premier League
    - Bundesliga
    - La Liga
    - Champions League
    - Europa League
    - Serie A
    - Ligue 1
  seasons: ["2021/22", "2022/23", "2023/24"]
  spatial_capture: fast        # fast = average positions; all = every spatial endpoint
  build_dataset: false        # Build the selected dataset types after collection

whoscored:
  # Applies to live WhoScored requests in both collection workflows.
  # Random delay between request starts; cached responses do not need to wait.
  request_delay_min_seconds: 15
  request_delay_max_seconds: 30
  # Optional verified stage IDs skip competition/season HTML discovery.
  # Include ALL main-competition stages for cups. Never use a tournament ID here.
  # Example key format: "La Liga 2023-2024": [verified_stage_id]
  stage_ids: {}
  refresh_schedule: false     # Refresh the standalone scraper's saved fixtures

api_test:
  providers: [sofascore, whoscored, fotmob]
  # Each ID belongs to its own provider; these are independent example games.
  match_ids:
    sofascore: 12436870
    whoscored: 1821095
    fotmob: 4506485

dataset:
  # Standalone builder selection. [] = all saved seasons.
  # main.py uses collection.competitions and collection.seasons above instead.
  collections: []              # Example: ["bundesliga-2025-26"]

  # Per-season files in dataset/<competition>/<YYYY-YYYY>/.
  # false leaves an existing dataset table untouched; it does not delete it.
  tables:
    events: false
    player_match_stats: true
    team_match_stats: true
    fixtures: true             # Uses saved schedules; not a historical backfill

  # Combined files at the dataset root, covering all saved collections.
  # For ID-only builds, set all four season tables above to false.
  references:
    player_ids: true
    team_ids: true
    match_ids: true

  # Keep false for a fully offline dataset build.
  maintenance:
    refresh_published_team_ids: false
    standardize_fixture_team_names: false  # Requires references.team_ids and dataset/fixtures.csv
