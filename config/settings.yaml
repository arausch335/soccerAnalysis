# Edit this file, then run main.py in PyCharm for any collection type.
# Relative paths resolve from this repository, regardless of the IDE directory.
paths:
  data: data
  dataset: dataset

collection:
  # Run any combination; choose combined OR sofascore because they share data.
  # combined = Sofascore baseline + FotMob/WhoScored enrichment
  # sofascore = Sofascore only (HTTP, visible browser, or automatic fallback)
  # whoscored_events = standalone WhoScored raw events
  # fotmob_players = standalone FotMob player_match_stats with fmb_ columns/IDs
  types: [combined]
  action: auto                 # auto, start, resume, export, status, probe
  competitions:
    - Premier League
    - Bundesliga
    - La Liga
    - Champions League
    - Europa League
    - Serie A
    - Ligue 1
  seasons: ["2021/22", "2022/23", "2023/24"]
  spatial_capture: fast        # fast = average positions; all = every spatial endpoint
  build_dataset: false        # Package combined/Sofascore seasons after collection
  show_timing: true            # Per-game duration, season ETA, full collection ETA

  # How Sofascore is accessed; this used to be called "transport".
  sofascore_access: extension  # http, browser (visible), auto fallback, or extension (normal Chrome)
  http:
    profiles: [chrome, chrome131]  # One coherent identity, saved across resumes
    languages: ["en-US,en;q=0.9"]
    proxy_env: SOCCER_PROXY_URL    # Optional; credentials stay outside YAML/Git
    delay_min_seconds: 8
    delay_max_seconds: 15
    attempts: 2                   # Never retries 401/403/429
  browser:
    channel: chrome              # Installed chrome/msedge, or Playwright chromium
    delay_min_seconds: 0.5        # Spacing between navigation, clicks and resource fetches
    delay_max_seconds: 1
    timeout_seconds: 30
    manual_wait_seconds: 120
  whoscored:
    access: auto              # http, browser, auto fallback, or extension
    request_delay_min_seconds: 15
    request_delay_max_seconds: 30
    # Verified stage IDs skip competition/season HTML discovery.
    # Key format: "La Liga 2023-2024": [verified_stage_id]
    stage_ids: {}
    refresh_schedule: false

api_test:
  providers:
  - sofascore
  - whoscored
  - fotmob
  match_ids:
    sofascore: 12436870
    whoscored: 1821095
    fotmob: 4506485
dataset:
  collections: []
  tables:
    events: false
    player_match_stats: true
    team_match_stats: true
    fixtures: true
  references:
    player_ids: true
    team_ids: true
    match_ids: true
  maintenance:
    refresh_published_team_ids: false
    standardize_fixture_team_names: false
