[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soccerAnalysis"
version = "0.2.0"
description = "Football collection, dataset building, and offline analysis"
requires-python = ">=3.10"
dependencies = ["curl_cffi>=0.13,<0.17", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "filelock>=3.13,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
analysis = ["scipy", "scikit-learn", "plotly", "pyarrow"]

[project.scripts]
soccer-analysis = "main:entrypoint"
soccer-dataset = "dataset_builder:main"
soccer-fixtures = "fixtures.collector:main"
soccer-data-review = "review_data:main"
soccer-api-test = "api_test:main"

[tool.setuptools]
py-modules = ["main", "dataset_builder", "api_test", "review_data"]

[tool.setuptools.packages.find]
namespaces = true
include = ["config", "analysis*", "collection*", "fixtures*", "models*", "providers*", "storage*", "tools*", "chrome_extension", "dashboard"]

[tool.setuptools.package-data]
"analysis.role_pipeline" = ["*.html"]
"analysis.match_visualization" = ["*.html", "*.css", "*.js"]
"providers" = ["*.json"]
"providers.concordance" = ["*.json"]

"config" = ["settings.yaml", "workers.yaml"]
"dashboard" = ["*.html", "*.css", "*.js"]

"chrome_extension" = ["*.json", "*.js", "*.html", "*.css"]
