[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-event-layer"
version = "0.1.0"
description = "An isolated, provider-adapted enrichment layer for soccer event streams"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
test = ["pytest>=8"]

[project.scripts]
soccer-event-layer = "event_layer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["event_layer*"]
