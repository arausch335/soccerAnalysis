<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Soccer Collector</title>
<link rel="stylesheet" href="popup.css"></head><body>
<h1>Soccer Collector</h1>
<p>Open Sofascore in this tab. Run the extension collection mode in Python, then paste its connection code.</p>
<label for="code">Connection code</label><input id="code" type="password" autocomplete="off" placeholder="Code printed by main.py">
<button id="connect">Connect this Sofascore tab</button>
<p id="status" role="status" aria-live="polite">Not connected.</p>
<div class="controls"><button id="pause">Pause</button><button id="resume">Resume</button><button id="disconnect">Disconnect</button></div>
<p class="note">Complete any human verification yourself, then click Resume. Only the selected Sofascore tab is controlled.</p>
<script type="module" src="popup.js"></script></body></html>
